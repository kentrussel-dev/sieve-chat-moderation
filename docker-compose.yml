version: '3.8'

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: sieve-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5

  init-kafka:
    image: apache/kafka:3.7.0
    container_name: sieve-init-kafka
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "bash", "-c" ]
    command: |
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic content.raw --partitions 3 --replication-factor 1
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic content.passed --partitions 3 --replication-factor 1
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic content.flagged --partitions 3 --replication-factor 1
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic content.escalated --partitions 3 --replication-factor 1
       echo 'All Kafka topics initialized successfully.'"

  classifier:
    build:
      context: .
      dockerfile: Dockerfile.classifier
    container_name: sieve-classifier
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  tier1-consumer:
    build:
      context: .
      dockerfile: Dockerfile.service
    container_name: sieve-tier1
    command: ["tier1", "-brokers=kafka:9092", "-classifier-url=http://classifier:8000", "-tau-low=0.20", "-tau-high=0.80"]
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      classifier:
        condition: service_healthy
    restart: on-failure

  tier2-consumer:
    build:
      context: .
      dockerfile: Dockerfile.service
    container_name: sieve-tier2
    command: ["tier2", "-brokers=kafka:9092", "-provider=simulator"]
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    restart: on-failure

  producer:
    build:
      context: .
      dockerfile: Dockerfile.service
    container_name: sieve-producer
    command: ["producer", "-brokers=kafka:9092", "-rate=50", "-burst-size=100", "-burst-interval=15s"]
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    restart: on-failure
